<!-- ADD THIS TO YOUR NAVBAR (between your logo and knowledge base selector) -->

<!-- Chat History Icon Button -->
<button class="chat-history-btn" onclick="openChatHistory()" title="Chat History" id="chat-history-btn">
    <!-- Clock Icon -->
    <svg class="history-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12,6 12,12 16,14"></polyline>
    </svg>
    
    <!-- Optional: Badge for session count -->
    <!-- <span class="badge" id="session-count-badge">5</span> -->
</button>

<!-- JAVASCRIPT INTEGRATION -->
<script>
// Chat History Functions
let chatHistoryModal = null;
let currentSessions = [];

// Open chat history modal
function openChatHistory() {
    // Add loading state
    document.getElementById('chat-history-btn').classList.add('loading');
    
    // Load and show history
    loadChatHistoryModal();
}

// Load chat history from your API
async function loadChatHistoryModal() {
    try {
        // Fetch chat history
        const response = await fetch('/api/v1/chat/history', {
            headers: {
                'Authorization': `Bearer ${getAuthToken()}`,
                'Content-Type': 'application/json'
            }
        });
        
        if (response.ok) {
            const data = await response.json();
            currentSessions = data.sessions;
            showHistoryModal(data.sessions);
        } else {
            throw new Error('Failed to load chat history');
        }
    } catch (error) {
        console.error('Error loading chat history:', error);
        alert('Failed to load chat history. Please try again.');
    } finally {
        // Remove loading state
        document.getElementById('chat-history-btn').classList.remove('loading');
    }
}

// Show history modal (you can customize this UI)
function showHistoryModal(sessions) {
    // Create modal if it doesn't exist
    if (!chatHistoryModal) {
        chatHistoryModal = createHistoryModal();
        document.body.appendChild(chatHistoryModal);
    }
    
    // Populate with sessions
    const sessionsList = chatHistoryModal.querySelector('.sessions-list');
    sessionsList.innerHTML = sessions.map(session => `
        <div class="session-item" onclick="loadChatSession('${session.session_id}')">
            <div class="session-title">${session.title}</div>
            <div class="session-meta">
                <span class="kb-name">${session.knowledge_base_name}</span>
                <span class="message-count">${session.message_count} messages</span>
                <span class="date">${formatRelativeDate(session.updated_at)}</span>
            </div>
            <div class="session-actions">
                <button onclick="loadChatSession('${session.session_id}'); event.stopPropagation();" class="load-btn">Load</button>
                <button onclick="deleteChatSession('${session.session_id}'); event.stopPropagation();" class="delete-btn">Delete</button>
            </div>
        </div>
    `).join('');
    
    // Show modal
    chatHistoryModal.style.display = 'flex';
    
    // Update badge with session count
    updateSessionBadge(sessions.length);
}

// Create modal DOM structure
function createHistoryModal() {
    const modal = document.createElement('div');
    modal.className = 'chat-history-modal';
    modal.innerHTML = `
        <div class="modal-overlay" onclick="closeChatHistory()"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3>Chat History</h3>
                <button onclick="closeChatHistory()" class="close-btn">×</button>
            </div>
            <div class="modal-body">
                <input type="text" placeholder="Search conversations..." class="search-input" onkeyup="filterSessions(event)">
                <div class="sessions-list"></div>
            </div>
        </div>
    `;
    
    // Add styles
    modal.style.cssText = `
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.75);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 10000;
    `;
    
    const modalContent = modal.querySelector('.modal-content');
    modalContent.style.cssText = `
        background: #2d3748;
        border-radius: 12px;
        width: 90%;
        max-width: 600px;
        max-height: 80vh;
        color: #e2e8f0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    `;
    
    return modal;
}

// Close history modal
function closeChatHistory() {
    if (chatHistoryModal) {
        chatHistoryModal.style.display = 'none';
    }
}

// Load specific chat session
async function loadChatSession(sessionId) {
    try {
        // Fetch session messages
        const response = await fetch(`/api/v1/chat/history/${sessionId}`, {
            headers: {
                'Authorization': `Bearer ${getAuthToken()}`,
                'Content-Type': 'application/json'
            }
        });
        
        if (response.ok) {
            const data = await response.json();
            
            // Update your chat interface with the loaded session
            updateChatInterface(data);
            
            // Close history modal
            closeChatHistory();
            
            // Show success message
            showNotification(`Loaded: ${data.session.title}`);
        } else {
            throw new Error('Failed to load session');
        }
    } catch (error) {
        console.error('Error loading session:', error);
        alert('Failed to load chat session. Please try again.');
    }
}

// Delete chat session
async function deleteChatSession(sessionId) {
    if (!confirm('Are you sure you want to delete this conversation?')) {
        return;
    }
    
    try {
        const response = await fetch(`/api/v1/chat/history/${sessionId}`, {
            method: 'DELETE',
            headers: {
                'Authorization': `Bearer ${getAuthToken()}`,
                'Content-Type': 'application/json'
            }
        });
        
        if (response.ok) {
            // Remove from current sessions
            currentSessions = currentSessions.filter(s => s.session_id !== sessionId);
            
            // Refresh the modal
            showHistoryModal(currentSessions);
            
            showNotification('Chat session deleted successfully');
        } else {
            throw new Error('Failed to delete session');
        }
    } catch (error) {
        console.error('Error deleting session:', error);
        alert('Failed to delete chat session. Please try again.');
    }
}

// Filter sessions based on search
function filterSessions(event) {
    const query = event.target.value.toLowerCase();
    const filtered = currentSessions.filter(session => 
        session.title.toLowerCase().includes(query) ||
        session.knowledge_base_name.toLowerCase().includes(query)
    );
    
    const sessionsList = chatHistoryModal.querySelector('.sessions-list');
    sessionsList.innerHTML = filtered.map(session => `
        <div class="session-item" onclick="loadChatSession('${session.session_id}')">
            <div class="session-title">${session.title}</div>
            <div class="session-meta">
                <span class="kb-name">${session.knowledge_base_name}</span>
                <span class="message-count">${session.message_count} messages</span>
                <span class="date">${formatRelativeDate(session.updated_at)}</span>
            </div>
        </div>
    `).join('');
}

// Update session count badge
function updateSessionBadge(count) {
    const badge = document.getElementById('session-count-badge');
    if (badge && count > 0) {
        badge.textContent = count;
        badge.style.display = 'flex';
    } else if (badge) {
        badge.style.display = 'none';
    }
}

// Helper functions
function formatRelativeDate(dateString) {
    const date = new Date(dateString);
    const now = new Date();
    const diffTime = Math.abs(now.getTime() - date.getTime());
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    
    if (diffDays === 1) return 'Today';
    if (diffDays === 2) return 'Yesterday';
    if (diffDays <= 7) return `${diffDays} days ago`;
    return date.toLocaleDateString();
}

function getAuthToken() {
    // Return your auth token (adjust based on your auth system)
    return localStorage.getItem('token') || sessionStorage.getItem('token') || 'your_token_here';
}

function updateChatInterface(sessionData) {
    // Update your chat interface with the loaded session
    // This depends on your existing chat implementation
    console.log('Loading session into chat:', sessionData);
    
    // Example: Set current session ID
    window.currentSessionId = sessionData.session.id;
    
    // Example: Update KB selector
    const kbSelector = document.querySelector('.kb-selector');
    if (kbSelector && sessionData.session.knowledge_base_id) {
        kbSelector.value = sessionData.session.knowledge_base_id;
    }
    
    // Example: Clear and populate chat messages
    // updateChatMessages(sessionData.messages);
}

function showNotification(message) {
    // Show a temporary notification (customize based on your UI)
    alert(message); // Replace with your notification system
}

// Auto-update session count on page load
document.addEventListener('DOMContentLoaded', function() {
    // Optionally load session count on page load
    // loadSessionCount();
});
</script>
