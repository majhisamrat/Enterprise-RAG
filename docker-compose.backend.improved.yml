version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: enterprise_rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - enterprise_rag
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: enterprise_rag_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - enterprise_rag
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NOTE: Qdrant is no longer used - replaced with Chroma DB (embedded vector store)
  # Vectors are stored in .chroma/vectors.pkl with KB-based collection isolation
  # Keeping Qdrant service for backward compatibility, but it is disabled by default
  # To enable Qdrant, uncomment below and set VECTOR_STORE=qdrant in environment
  # qdrant:
  #   image: qdrant/qdrant:v1.9.0
  #   container_name: enterprise_rag_qdrant
  #   restart: unless-stopped
  #   volumes:
  #     - qdrant_data:/qdrant/storage
  #   networks:
  #     - enterprise_rag
  #   ports:
  #     - "6333:6333"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: enterprise_rag_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - enterprise_rag
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: enterprise_rag_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      SYNC_DATABASE_URL: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://redis:6379/0
      # NOTE: Chroma DB is embedded - vectors stored in .chroma/vectors.pkl
      # No separate service needed, persists across FastAPI and Celery processes
      ELASTICSEARCH_URL: http://elasticsearch:9200
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}
      DEBUG: "false"
      LOG_LEVEL: ${LOG_LEVEL}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      LLM_PROVIDER: ${LLM_PROVIDER}
      TEMPERATURE: ${TEMPERATURE}
      TOP_P: ${TOP_P}
      MAX_OUTPUT_TOKENS: ${MAX_OUTPUT_TOKENS}
      UPLOAD_DIR: ${UPLOAD_DIR}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE}
      FRONTEND_URL: ${FRONTEND_URL}
      LLM_CODEGEN_MODEL_PROVIDER: ${LLM_CODEGEN_MODEL_PROVIDER}
      LLM_CODEGEN_MODEL: ${LLM_CODEGEN_MODEL}
      LLM_CODEGEN_TEMPERATURE: ${LLM_CODEGEN_TEMPERATURE}
      DUCKDB_PATH: ${DUCKDB_PATH}
      ENABLE_RERANKER: ${ENABLE_RERANKER}
      RERANKER_MAX_CANDIDATES: ${RERANKER_MAX_CANDIDATES}
      MAX_RETRIEVAL_RESULTS: ${MAX_RETRIEVAL_RESULTS}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - chroma_data:/app/.chroma  # Persistent Chroma DB vector storage (EBS-backed)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - enterprise_rag

  celery:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: enterprise_rag_celery
    restart: unless-stopped
    command: celery -A app.tasks worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      SYNC_DATABASE_URL: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://redis:6379/0
      # NOTE: Chroma DB is embedded - vectors shared via .chroma/vectors.pkl
      ELASTICSEARCH_URL: http://elasticsearch:9200
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "false"
      LOG_LEVEL: ${LOG_LEVEL}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      LLM_PROVIDER: ${LLM_PROVIDER}
      UPLOAD_DIR: ${UPLOAD_DIR}
      LLM_CODEGEN_MODEL_PROVIDER: ${LLM_CODEGEN_MODEL_PROVIDER}
      LLM_CODEGEN_MODEL: ${LLM_CODEGEN_MODEL}
      LLM_CODEGEN_TEMPERATURE: ${LLM_CODEGEN_TEMPERATURE}
      DUCKDB_PATH: ${DUCKDB_PATH}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - chroma_data:/app/.chroma  # Persistent Chroma DB vector storage (EBS-backed, shared with backend)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - enterprise_rag
    expose:
      - "5555"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  chroma_data:
    driver: local  # Persistent Docker volume for Chroma DB (EBS-backed on EC2)
  # qdrant_data:  # No longer used - Chroma DB stores vectors in chroma_data volume
  #   driver: local
  elasticsearch_data:
    driver: local

networks:
  enterprise_rag:
    driver: bridge

