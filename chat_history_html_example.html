<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with History</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a202c;
            color: #e2e8f0;
            height: 100vh;
            overflow: hidden;
        }
        
        /* Navbar Styles */
        .navbar {
            background-color: #2d3748;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #4a5568;
        }
        
        .navbar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .navbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .chat-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 600;
        }
        
        /* History Icon Button */
        .history-btn {
            background: none;
            border: none;
            color: #a0aec0;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .history-btn:hover {
            background-color: #4a5568;
            color: #e2e8f0;
        }
        
        .history-icon {
            width: 20px;
            height: 20px;
        }
        
        /* KB Selector */
        .kb-selector {
            background-color: #4a5568;
            color: #e2e8f0;
            border: 1px solid #718096;
            padding: 8px 12px;
            border-radius: 6px;
            min-width: 200px;
        }
        
        .new-chat-btn {
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        
        .new-chat-btn:hover {
            background-color: #2c5aa0;
        }
        
        /* Chat History Modal */
        .history-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.75);
            display: none;
            z-index: 1000;
        }
        
        .history-modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .history-content {
            background-color: #2d3748;
            border-radius: 12px;
            width: 90%;
            max-width: 800px;
            height: 80%;
            display: flex;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        
        .history-sidebar {
            width: 300px;
            border-right: 1px solid #4a5568;
            display: flex;
            flex-direction: column;
        }
        
        .history-header {
            padding: 20px;
            border-bottom: 1px solid #4a5568;
        }
        
        .history-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        
        .close-btn {
            background: none;
            border: none;
            color: #a0aec0;
            padding: 4px;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .close-btn:hover {
            color: #e2e8f0;
            background-color: #4a5568;
        }
        
        .search-box {
            width: 100%;
            background-color: #4a5568;
            border: 1px solid #718096;
            color: #e2e8f0;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .search-box::placeholder {
            color: #a0aec0;
        }
        
        .sessions-list {
            flex: 1;
            overflow-y: auto;
        }
        
        .session-item {
            padding: 16px 20px;
            border-bottom: 1px solid #4a5568;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .session-item:hover {
            background-color: #374151;
        }
        
        .session-item.current {
            background-color: #3182ce;
        }
        
        .session-title {
            font-weight: 500;
            margin-bottom: 4px;
            font-size: 14px;
        }
        
        .session-kb {
            color: #a0aec0;
            font-size: 12px;
            margin-bottom: 8px;
        }
        
        .session-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 11px;
            color: #718096;
        }
        
        .session-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        
        .session-action-btn {
            background: none;
            border: none;
            color: #a0aec0;
            padding: 4px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .session-action-btn:hover {
            color: #e2e8f0;
        }
        
        .session-action-btn.load {
            color: #3182ce;
        }
        
        .session-action-btn.delete {
            color: #e53e3e;
        }
        
        /* Loading and empty states */
        .loading, .empty {
            padding: 40px 20px;
            text-align: center;
            color: #a0aec0;
        }
        
        /* Chat area (your existing styles) */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 60px);
        }
        
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        
        .chat-input {
            padding: 20px;
            border-top: 1px solid #4a5568;
        }
        
        .input-container {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        
        .chat-input input {
            flex: 1;
            background-color: #4a5568;
            border: 1px solid #718096;
            color: #e2e8f0;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .send-btn {
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-left">
            <div class="chat-title">
                <span>🤖</span>
                <span>Chat Assistant</span>
            </div>
            
            <!-- Chat History Button -->
            <button class="history-btn" onclick="openHistoryModal()" title="Chat History">
                <svg class="history-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12,6 12,12 16,14"></polyline>
                </svg>
                <span>History</span>
            </button>
        </div>
        
        <div class="navbar-right">
            <select class="kb-selector" id="kb-selector">
                <option value="">All Knowledge Bases</option>
                <option value="sales">Sales Documents</option>
                <option value="ops">Operations Manual</option>
            </select>
            
            <button class="new-chat-btn" onclick="startNewChat()">+ New Chat</button>
        </div>
    </nav>
    
    <!-- Main Chat Container -->
    <div class="chat-container">
        <div class="chat-messages" id="chat-messages">
            <!-- Chat messages will go here -->
            <p style="text-align: center; color: #a0aec0; margin-top: 100px;">
                Start a new conversation or select from your chat history
            </p>
        </div>
        
        <div class="chat-input">
            <div class="input-container">
                <input type="text" id="message-input" placeholder="Ask anything across your knowledge bases..." />
                <button class="send-btn" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>
    
    <!-- Chat History Modal -->
    <div class="history-modal" id="history-modal">
        <div class="history-content">
            <!-- Sidebar -->
            <div class="history-sidebar">
                <div class="history-header">
                    <div class="history-title">
                        <h3>Chat History</h3>
                        <button class="close-btn" onclick="closeHistoryModal()">
                            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                    <input type="text" class="search-box" placeholder="Search conversations..." 
                           id="history-search" onkeyup="filterSessions()" />
                </div>
                
                <div class="sessions-list" id="sessions-list">
                    <div class="loading">Loading chat history...</div>
                </div>
            </div>
            
            <!-- Message View Area (you can expand this) -->
            <div style="flex: 1; display: flex; align-items: center; justify-content: center; color: #a0aec0;">
                <div style="text-align: center;">
                    <svg width="48" height="48" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin: 0 auto 16px;">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-3.582 8-8 8a8.955 8.955 0 01-2.244-.308l-3.5 2.826A1 1 0 015 21V8a8 8 0 1116 4z"></path>
                    </svg>
                    <p>Select a conversation to view details</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const API_BASE = 'http://localhost:8000/api/v1';
        const token = localStorage.getItem('token') || 'your_token_here';
        
        let currentSessionId = null;
        let chatSessions = [];
        
        // API calls
        async function apiCall(endpoint, options = {}) {
            const response = await fetch(`${API_BASE}${endpoint}`, {
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json',
                    ...options.headers
                },
                ...options
            });
            
            if (!response.ok) {
                throw new Error(`API call failed: ${response.statusText}`);
            }
            
            return response.json();
        }
        
        // Load chat history
        async function loadChatHistory() {
            try {
                const data = await apiCall('/chat/history');
                chatSessions = data.sessions;
                displaySessions(chatSessions);
            } catch (error) {
                console.error('Failed to load chat history:', error);
                document.getElementById('sessions-list').innerHTML = 
                    '<div class="empty">Failed to load chat history</div>';
            }
        }
        
        // Display sessions in sidebar
        function displaySessions(sessions) {
            const container = document.getElementById('sessions-list');
            
            if (sessions.length === 0) {
                container.innerHTML = '<div class="empty">No conversations found</div>';
                return;
            }
            
            container.innerHTML = sessions.map(session => `
                <div class="session-item ${session.session_id === currentSessionId ? 'current' : ''}" 
                     onclick="selectSession('${session.session_id}')">
                    <div class="session-title">${session.title}</div>
                    <div class="session-kb">📁 ${session.knowledge_base_name}</div>
                    <div class="session-meta">
                        <span>💬 ${session.message_count} messages</span>
                        <span>📅 ${formatDate(session.updated_at)}</span>
                    </div>
                    <div class="session-actions">
                        <button class="session-action-btn load" onclick="loadSession('${session.session_id}'); event.stopPropagation();">
                            Load
                        </button>
                        <button class="session-action-btn delete" onclick="deleteSession('${session.session_id}'); event.stopPropagation();">
                            Delete
                        </button>
                    </div>
                </div>
            `).join('');
        }
        
        // Format date helper
        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffTime = Math.abs(now.getTime() - date.getTime());
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays === 1) return 'Today';
            if (diffDays === 2) return 'Yesterday';
            if (diffDays <= 7) return `${diffDays} days ago`;
            return date.toLocaleDateString();
        }
        
        // Filter sessions based on search
        function filterSessions() {
            const query = document.getElementById('history-search').value.toLowerCase();
            const filtered = chatSessions.filter(session => 
                session.title.toLowerCase().includes(query) ||
                session.knowledge_base_name.toLowerCase().includes(query)
            );
            displaySessions(filtered);
        }
        
        // Select session (just highlight)
        function selectSession(sessionId) {
            // Just update UI, you can expand to show messages
            currentSessionId = sessionId;
            displaySessions(chatSessions.filter(s => 
                document.getElementById('history-search').value === '' || 
                s.title.toLowerCase().includes(document.getElementById('history-search').value.toLowerCase()) ||
                s.knowledge_base_name.toLowerCase().includes(document.getElementById('history-search').value.toLowerCase())
            ));
        }
        
        // Load session into main chat
        async function loadSession(sessionId) {
            try {
                const data = await apiCall(`/chat/history/${sessionId}`);
                
                // Update current session
                currentSessionId = sessionId;
                
                // Clear and load messages into main chat
                const messagesContainer = document.getElementById('chat-messages');
                messagesContainer.innerHTML = data.messages.map(msg => `
                    <div style="margin-bottom: 16px; ${msg.sender_role === 'user' ? 'text-align: right;' : ''}">
                        <div style="display: inline-block; max-width: 80%; background-color: ${
                            msg.sender_role === 'user' ? '#3182ce' : '#4a5568'
                        }; color: white; padding: 12px 16px; border-radius: 12px; text-align: left;">
                            <div>${msg.content}</div>
                            <div style="font-size: 11px; opacity: 0.7; margin-top: 8px;">
                                ${formatDate(msg.created_at)}
                            </div>
                        </div>
                    </div>
                `).join('');
                
                // Close modal
                closeHistoryModal();
                
                // Scroll to bottom
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
                
                alert(`Loaded conversation: ${data.session.title}`);
                
            } catch (error) {
                console.error('Failed to load session:', error);
                alert('Failed to load conversation');
            }
        }
        
        // Delete session
        async function deleteSession(sessionId) {
            if (!confirm('Are you sure you want to delete this conversation?')) return;
            
            try {
                await apiCall(`/chat/history/${sessionId}`, { method: 'DELETE' });
                
                // Remove from local array
                chatSessions = chatSessions.filter(s => s.session_id !== sessionId);
                
                // Update display
                filterSessions();
                
                // Clear if it was current session
                if (currentSessionId === sessionId) {
                    currentSessionId = null;
                    document.getElementById('chat-messages').innerHTML = 
                        '<p style="text-align: center; color: #a0aec0; margin-top: 100px;">Start a new conversation or select from your chat history</p>';
                }
                
            } catch (error) {
                console.error('Failed to delete session:', error);
                alert('Failed to delete conversation');
            }
        }
        
        // Modal controls
        function openHistoryModal() {
            document.getElementById('history-modal').classList.add('show');
            loadChatHistory();
        }
        
        function closeHistoryModal() {
            document.getElementById('history-modal').classList.remove('show');
        }
        
        // Chat functions (basic implementation)
        function startNewChat() {
            currentSessionId = null;
            document.getElementById('chat-messages').innerHTML = 
                '<p style="text-align: center; color: #a0aec0; margin-top: 100px;">Start a new conversation</p>';
        }
        
        function sendMessage() {
            const input = document.getElementById('message-input');
            const query = input.value.trim();
            if (!query) return;
            
            // Add user message to UI
            const messagesContainer = document.getElementById('chat-messages');
            messagesContainer.innerHTML += `
                <div style="margin-bottom: 16px; text-align: right;">
                    <div style="display: inline-block; max-width: 80%; background-color: #3182ce; color: white; padding: 12px 16px; border-radius: 12px; text-align: left;">
                        ${query}
                    </div>
                </div>
            `;
            
            input.value = '';
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            
            // Here you would call your chat API
            // For demo, just add a bot response
            setTimeout(() => {
                messagesContainer.innerHTML += `
                    <div style="margin-bottom: 16px;">
                        <div style="display: inline-block; max-width: 80%; background-color: #4a5568; color: white; padding: 12px 16px; border-radius: 12px;">
                            This is a demo response. Connect to your chat API to get real responses.
                        </div>
                    </div>
                `;
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, 1000);
        }
        
        // Close modal when clicking outside
        document.getElementById('history-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeHistoryModal();
            }
        });
        
        // Enter key to send message
        document.getElementById('message-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
